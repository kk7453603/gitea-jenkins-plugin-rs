services:
  jenkins:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: jenkins-gitea-rust:local
    container_name: jenkins-gitea-rust
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

volumes:
  jenkins_home:
