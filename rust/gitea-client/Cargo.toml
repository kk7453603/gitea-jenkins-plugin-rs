[package]
name = "gitea-client"
version = "0.1.0"
edition = "2021"
description = "Native Rust HTTP client for Gitea API used by the Jenkins Gitea plugin"
license = "MIT"

[lib]
name = "gitea_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
thiserror = "1"
jni = "0.21"
url = "2"
base64 = "0.22"
bytes = "1"
axum = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Stage 12 — TLS trust store support. `rustls` + `rustls-pemfile` are used by
# the standalone `build_client_config` helper; the main path goes through
# `reqwest::Certificate::from_pem`, but the explicit rustls deps are kept so
# future code (or callers using `rustls::ClientConfig` directly) can reuse the
# same machinery.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
rustls-pki-types = { version = "1", features = ["alloc"] }
webpki-roots = "1"  # matches version pulled in by reqwest's rustls-tls feature
# Stage 16 — IP allowlist (CIDR matching for IPv4 + IPv6).
cidr = "0.2"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
